# LensLink virtual camera: two devices —
#   /dev/video9  "LensLink Virtual Camera" (exclusive caps: capture node
#                appears only while lenslinkd streams)
#   /dev/video20 "BigCam Virtual 1"        (kept as-is for BigCam)
options v4l2loopback devices=2 video_nr=9,20 card_label="LensLink Virtual Camera,BigCam Virtual 1" exclusive_caps=Y,N
